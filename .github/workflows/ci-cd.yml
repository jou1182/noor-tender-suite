name: ConTech AI Platform CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-quality-gates:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black mypy pytest httpx
        pip install -r requirements.txt
    - name: Lint with Ruff
      run: ruff check .
    - name: Type checking with Mypy
      run: mypy app/
    - name: Run Pytest
      run: pytest tests/

  frontend-quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: "18"
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run ESLint
      run: npm run lint --if-present
    - name: Run TypeScript type check
      run: npx tsc --noEmit
    - name: Test Build
      run: npm run build

  docker-validation:
    needs: [backend-quality-gates, frontend-quality-gates]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Backend Image
      run: docker build -t contech-backend -f Dockerfile.backend .
    - name: Build Frontend Image
      run: cd frontend && docker build -t contech-frontend -f Dockerfile .
